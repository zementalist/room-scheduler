# Render Blueprint: free web service. The container disk is ephemeral on Render's free plan, so the
# database is continuously replicated to Backblaze B2 (Litestream) and restored on every start.
services:
  - type: web
    name: room-scheduler
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /data
      - key: BACKUP_KEEP
        value: "14"
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT
        sync: false
      - key: LITESTREAM_REGION
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
